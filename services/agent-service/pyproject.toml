[project]
name = "safr-x-atp-demo-agent-service"
version = "0.1.0"
description = "Minimal Google ADK-backed agent service for the SAFR x ATP transfer demo"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.128.0",
  "google-adk==1.18.0",
  "httpx>=0.28.0",
  "python-dotenv>=1.0.0",
  "uvicorn>=0.39.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
